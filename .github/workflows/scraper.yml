name: Scraper diario

on:
  # Corre todos los días a las 8am UTC, 5am Paraguay.
  schedule:
    - cron: "0 8 * * *"
  # Permite ejecutar el scraper manualmente desde GitHub Actions.
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scrapers
        run: |
          set +e
          estado=0

          python3 -u main.py --supermercado stock --limite-categorias 10 --limite-paginas 2
          codigo_stock=$?
          if [ "$codigo_stock" -ne 0 ]; then
            echo "Stock fallo con codigo $codigo_stock; se continua con Superseis."
            estado=1
          fi

          python3 -u main.py --supermercado superseis --limite-categorias 5 --limite-paginas 2
          codigo_superseis=$?
          if [ "$codigo_superseis" -ne 0 ]; then
            echo "Superseis fallo con codigo $codigo_superseis."
            estado=1
          fi

          python3 -u scripts/sync_sqlite_to_supabase.py --apply
          codigo_sync=$?
          if [ "$codigo_sync" -ne 0 ]; then
            echo "Sincronizacion final fallo con codigo $codigo_sync."
            estado=1
          fi

          exit "$estado"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
