name: Scraper diario

on:
  # Corre todos los días a las 8am UTC, 5am Paraguay.
  schedule:
    - cron: "0 8 * * *"
  # Permite ejecutar el scraper manualmente desde GitHub Actions.
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper Stock
        run: python3 -u main.py --supermercado stock --limite-categorias 10 --limite-paginas 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Intentar scraper Superseis
        continue-on-error: true
        run: python3 -u main.py --supermercado superseis --limite-categorias 5 --limite-paginas 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
